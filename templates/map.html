<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>SWMM Platform - Hydraulic Expert</title>
    <!-- FontAwesome pour les icones de l'éditeur -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            margin: 0;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        #sidebar {
            width: 280px;
            background: #16213e;
            padding: 16px;
        }

        #map-container {
            position: relative;
            flex: 1;
        }

        #map {
            flex: 1;
            height: 100%;
        }

        .cluster-button {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        .cluster-button:hover {
            background: #219a52;
        }

        .cluster-button:disabled {
            background: #7f8c8d;
            cursor: not-allowed;
        }

        #cluster-status {
            margin-top: 10px;
            font-size: 0.9em;
            background: #0f3460;
            padding: 8px;
            border-radius: 4px;
        }

        /* Barre d'outils d'édition hydraulique */
        .edit-toolbar {
            position: fixed; /* Changé de absolute à fixed car en dehors du map */
            top: 20px;
            right: 20px;
            z-index: 2000;
            background: rgba(22, 33, 62, 0.95);
            backdrop-filter: blur(5px);
            padding: 8px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .tool-btn {
            width: 40px;
            height: 40px;
            background: #0f3460;
            border: none;
            border-radius: 6px;
            color: #eee;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 1.2em;
        }

        .tool-btn:hover {
            background: #e94560;
            transform: scale(1.05);
        }

        .tool-btn.active {
            background: #e94560;
            box-shadow: 0 0 10px #e94560;
        }

        .tool-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .tool-tip {
            position: relative;
        }

        .tool-tip:hover::after {
            content: attr(data-tip);
            position: absolute;
            left: 50px;
            top: 50%;
            transform: translateY(-50%);
            background: #1a1a2e;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            z-index: 1001;
            border: 1px solid #e94560;
        }

        #bassin-section {
        display: none;
        margin-top: 16px;
    }

    #bassin-section label {
        font-size: 13px;
        font-weight: 600;
        color: #aab;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        display: block;
        margin-bottom: 6px;
    }

    #bassin-select {
        width: 100%;
        padding: 8px 10px;
        background: #0f3460;
        color: #eee;
        border: 1px solid #2980b9;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
        outline: none;
        transition: border-color 0.2s;
    }

    #bassin-select:hover, #bassin-select:focus {
        border-color: #3498db;
    }

    #bassin-select option {
        background: #16213e;
    }

    #bassin-info {
        margin-top: 8px;
        font-size: 12px;
        color: #95a5a6;
        line-height: 1.5;
    }

    /* Overlay de chargement */
    #loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        font-size: 24px;
        color: #fff;
    }

    .loading-content {
        text-align: center;
        background: rgba(30, 33, 62, 0.95);
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
        min-width: 300px;
    }

    .loading-title {
        font-size: 18px;
        margin-bottom: 15px;
        color: #3498db;
    }

    .loading-step {
        font-size: 14px;
        margin: 8px 0;
        opacity: 0.8;
    }

    .spinner {
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>

<body>
    <!-- Overlay de chargement -->
    <div id="loading-overlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <div>Chargement des données...</div>
        </div>
    </div>

    <div id="sidebar">
        <h2>SWMM Platform</h2>
        <div id="stat-total" style="display:none;">--</div>
        <div id="mini-stats">Chargement...</div>


        <div>
            <input type="checkbox" id="f-conduites" checked><label for="f-conduites">Conduites</label><br>
            <input type="checkbox" id="f-regards"><label for="f-regards">Regard</label><br>
            <input type="checkbox" id="f-stations" checked><label for="f-stations">Stations</label><br>
            <input type="checkbox" id="f-step" checked><label for="f-step">STEP</label><br>
            <input type="checkbox" id="f-ouvrages" checked><label for="f-ouvrages">Ouvrages</label><br>
            <hr style="border: 0.5px solid #eee; margin: 10px 0;">
            <input type="checkbox" id="f-bassins" disabled><label id="label-bassins" for="f-bassins" style="color: #999;"><b>Bassins Versants</b></label>
        </div>


        <hr style="border: 0.5px solid #eee; margin: 10px 0;">
        <div id="recent-changes" style="background: rgba(255,255,255,0.9); padding: 10px; border-radius: 6px; margin: 10px 0;">
            <h3 style="margin: 0 0 8px 0; font-size: 14px; color: #16213e; display: flex; align-items: center;">
                📡 Modifications récentes
                <span id="modif-count" style="margin-left: 8px; background: #3498db; color: white; padding: 2px 6px; border-radius: 10px; font-size: 11px; font-weight: bold;">0</span>
                <span id="sync-indicator" style="margin-left: auto; width: 8px; height: 8px; background: #ccc; border-radius: 50%; display: inline-block;"></span>
            </h3>
            <div id="changes-list" style="font-size: 11px; max-height: 120px; overflow-y: auto; background: rgba(0,0,0,0.05); padding: 5px; border-radius: 4px; color: #000;">
                <div style="color: #666; font-style: italic;">En attente de modifications...</div>
            </div>
        </div>

        <!-- Boîte de signalements du jour -->
        <div id="incidents-box" style="background: rgba(255,255,255,0.9); padding: 10px; border-radius: 6px; margin: 10px 0; border: 1px solid #e74c3c;">
            <h3 style="margin: 0 0 8px 0; font-size: 14px; color: #c0392b; display: flex; align-items: center;">
                🚨 Signalements du jour
                <span id="incident-count" style="margin-left: 8px; background: #e74c3c; color: white; padding: 2px 6px; border-radius: 10px; font-size: 11px; font-weight: bold;">0</span>
            </h3>
            <div id="incidents-list" style="font-size: 11px; max-height: 120px; overflow-y: auto; background: rgba(0,0,0,0.05); padding: 5px; border-radius: 4px; color: #000;">
                <div style="color: #666; font-style: italic;">Aucun signalement aujourd'hui.</div>
            </div>
        </div>

        <!-- Score qualité réseau -->
        <div id="quality-score-container" style="margin: 16px 0; padding: 12px; background: rgba(255,255,255,0.1); border-radius: 8px; display: none;">
            <div style="font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #eee;">
                <i class="fas fa-chart-line"></i> Diagnostic Qualité
            </div>
            <div id="quality-score" style="font-size: 28px; font-weight: bold; color: #3498db; text-align: center;"></div>
            <div id="quality-breakdown" style="font-size: 11px; margin-top: 8px; color: #aab;"></div>
        </div>

        <button class="cluster-button" id="detect-cluster-btn">Détecter les bassins urbains</button>
        <div id="cluster-status"></div>

        <!-- Liste déroulante des bassins (visible après détection) -->
        <div id="bassin-section">
            <label for="bassin-select">🗺 Sélectionner un bassin</label>
            <select id="bassin-select"></select>
            <div id="bassin-info"></div>
        </div>
    </div>
    <!-- Barre d'outils d'édition (déplacée hors de map) -->
    <div class="edit-toolbar" id="main-edit-toolbar">
        <button class="tool-btn tool-tip" id="btn-create-bassin" data-tip="Nouveau Bassin (Polygone)">
            <i class="fas fa-draw-polygon"></i>
        </button>
        <button class="tool-btn tool-tip" id="btn-merge-bassin" data-tip="Fusionner Bassins" disabled>
            <i class="fas fa-link"></i>
        </button>
        <button class="tool-btn tool-tip" id="btn-delete-bassin" data-tip="Supprimer" disabled>
            <i class="fas fa-trash-alt"></i>
        </button>
        <hr style="border: 0.5px solid rgba(255,255,255,0.1); margin: 4px 0;">
        <button class="tool-btn tool-tip" id="btn-save-edit" data-tip="Enregistrer les modifications" disabled>
            <i class="fas fa-save"></i>
        </button>
    </div>



    <!-- Modal d'édition (Flottante) -->
    <div id="edit-modal" style="display: none; position: fixed; top: 100px; left: 100px; width: 350px; background: white; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 3000; overflow: hidden; border: 1px solid #ccc; flex-direction: column;">
        <div id="modal-header" style="background: #16213e; color: white; padding: 10px 15px; cursor: move; display: flex; justify-content: space-between; align-items: center;">
            <h3 id="modal-title" style="margin: 0; font-size: 16px;">Modifier</h3>
            <button type="button" id="close-btn-header" style="background: none; border: none; color: white; cursor: pointer; font-size: 18px; line-height: 1;">&times;</button>
        </div>
        <div style="padding: 15px; max-height: 400px; overflow-y: auto;">
            <form id="edit-form" style="color: #333;">
                <!-- Champs dynamiques -->
            </form>
            <div style="margin-top: 20px; text-align: right;">
                <button type="button" id="save-btn" style="background: #27ae60; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer;">Enregistrer</button>
                <button type="button" id="cancel-btn" style="background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; margin-left: 10px;">Annuler</button>
            </div>
        </div>
    </div>

    <!-- Indicateur de zoom -->
    <div id="map-container" style="position: relative; flex: 1;">
        <div id="map"></div>
        <div id="zoom-indicator" style="position: absolute; top: 10px; left: 10px; z-index: 1000; background: rgba(0,0,0,0.7); color: white; padding: 5px 10px; border-radius: 4px; font-size: 12px;">
            Zoom: 13
        </div>
    </div> <!-- Fin map-container -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/js/map/map_state.js"></script>
    <script src="/static/js/map/map_core.js"></script>
    <script src="/static/js/map/map_notifications.js"></script>
    <script src="/static/js/map/map_manual_basins.js"></script>
    <script src="/static/js/map/map_layers.js"></script>
    <script src="/static/js/map/map_cluster_detection.js"></script>
    <script src="/static/js/map/map_quality.js"></script>
    <script src="/static/js/map/map_edit_attributes.js"></script>
    <script src="/static/js/map/map_init.js"></script>
</body>

</html>
