<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — SWMM Platform SaaS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0a0f1d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
            color: #1e293b;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 440px;
            width: 100%;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .auth-header {
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            padding: 32px 25px 22px;
            text-align: center;
        }
        .auth-brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #ffffff;
            font-size: 28px;
            margin-bottom: 12px;
            box-shadow: 0 8px 16px rgba(2, 132, 199, 0.35);
        }
        .auth-body {
            padding: 30px;
        }
        .auth-footer {
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            padding: 16px 25px;
            text-align: center;
            font-size: 0.9rem;
        }
        .btn-auth-primary {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            border: none;
            padding: 12px;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 10px;
            transition: all 0.2s ease-in-out;
        }
        .btn-auth-primary:hover {
            background: linear-gradient(135deg, #0369a1, #075985);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.4);
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="auth-header">
        <div class="auth-brand-icon">
            <i class="fas fa-water"></i>
        </div>
        <h3 class="fw-bold mb-1" style="color: #0f172a;">SWMM Platform</h3>
        <p class="text-muted small mb-3">Espace ingénierie d'assainissement et modélisation SWMM 5.2</p>

        <!-- Bascule Navigation Connexion / Inscription -->
        <div class="d-flex p-1 rounded-3 bg-white border shadow-sm text-center">
            <span class="btn btn-sm btn-primary flex-fill fw-bold py-1">
                <i class="fas fa-sign-in-alt me-1"></i> Se connecter
            </span>
            <a href="/register" class="btn btn-sm text-secondary flex-fill fw-semibold py-1 text-decoration-none">
                <i class="fas fa-user-plus me-1"></i> Créer un compte
            </a>
        </div>
    </div>

    <div class="auth-body">
        <div id="alertBox" class="alert alert-danger d-none" role="alert">
            <span id="alertMsg"></span>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label small fw-semibold text-secondary">
                    <i class="fas fa-envelope me-1"></i> Adresse email
                </label>
                <input type="email" class="form-control form-control-lg fs-6" id="email" name="email"
                       placeholder="ingenieur@regie-eaux.dz" required autofocus>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label for="password" class="form-label small fw-semibold text-secondary mb-0">
                        <i class="fas fa-lock me-1"></i> Mot de passe
                    </label>
                </div>
                <div class="input-group">
                    <input type="password" class="form-control form-control-lg fs-6" id="password" name="password"
                           placeholder="••••••••" required>
                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                        <i class="fas fa-eye text-muted"></i>
                    </button>
                </div>
            </div>

            <div class="mb-3 d-none" id="activationCodeGroup">
                <label for="activationCode" class="form-label small fw-semibold text-primary">
                    <i class="fas fa-key me-1"></i> Code d'activation à 6 chiffres
                </label>
                <input type="text" class="form-control form-control-lg text-center fw-bold" id="activationCode"
                       maxlength="6" placeholder="••••••" style="letter-spacing: 6px;">
                <div class="form-text small text-muted">Saisissez le code reçu par e-mail pour activer votre compte.</div>
            </div>

            <button type="submit" id="btnSubmit" class="btn btn-primary btn-auth-primary w-100 text-white shadow-sm mt-3 mb-2">
                <i class="fas fa-sign-in-alt me-2"></i> <span id="btnSubmitText">Se connecter</span>
            </button>
        </form>
    </div>

    <div class="auth-footer text-muted">
        Nouveau sur SWMM Platform ?
        <a href="/register" class="fw-semibold text-primary text-decoration-none">
            Créer un compte
        </a>
    </div>
</div>

<script>
    // Récupération éventuelle de l'email depuis l'URL
    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const emailParam = urlParams.get('email');
        if (emailParam) {
            const emailInput = document.getElementById('email');
            if (emailInput) {
                emailInput.value = emailParam;
                document.getElementById('password').focus();
            }
        }
    });

    // Bascule mot de passe
    const passInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePassword');
    toggleBtn.addEventListener('click', () => {
        const isPass = passInput.type === 'password';
        passInput.type = isPass ? 'text' : 'password';
        toggleBtn.querySelector('i').className = isPass ? 'fas fa-eye-slash text-primary' : 'fas fa-eye text-muted';
    });

    // Soumission du formulaire
    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const alertMsg = document.getElementById('alertMsg');
    const btnSubmit = document.getElementById('btnSubmit');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.classList.add('d-none');
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Vérification...';

        const emailVal = document.getElementById('email').value.trim();
        const codeInput = document.getElementById('activationCode');
        const isVerifying = codeInput && !document.getElementById('activationCodeGroup').classList.contains('d-none');

        try {
            let data;
            if (isVerifying && codeInput.value.trim()) {
                const resp = await fetch('/api/v1/auth/verify-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: emailVal,
                        code: codeInput.value.trim()
                    })
                });
                data = await resp.json();
                if (!resp.ok) throw new Error(data.detail || "Code d'activation invalide");
            } else {
                const resp = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: emailVal,
                        password: document.getElementById('password').value
                    })
                });
                data = await resp.json();
                if (!resp.ok) throw new Error(data.detail || 'Identifiants invalides');
            }

            // Si le compte nécessite la vérification par code
            if (data.requires_verification) {
                document.getElementById('activationCodeGroup').classList.remove('d-none');
                let msg = "Votre adresse e-mail n'a pas encore été validée. Saisissez le code d'activation à 6 chiffres reçu par e-mail.";
                if (data.dev_code) {
                    msg += `<br><strong>Simulation locale :</strong> Code <code>${data.dev_code}</code>`;
                }
                alertMsg.innerHTML = msg;
                alertBox.className = "alert alert-warning";
                alertBox.classList.remove('d-none');
                btnSubmit.disabled = false;
                document.getElementById('btnSubmitText').textContent = "Valider le code & Se connecter";
                setTimeout(() => codeInput.focus(), 150);
                return;
            }

            // Sauvegarder le token
            if (data.access_token) {
                localStorage.setItem('swmm_access_token', data.access_token);
                document.cookie = `access_token=${data.access_token}; path=/; max-age=604800; SameSite=Lax`;
            }

            // Redirection vers le cockpit
            const params = new URLSearchParams(window.location.search);
            const nextUrl = params.get('next') || '/map';
            window.location.href = nextUrl;

        } catch (err) {
            alertMsg.textContent = err.message;
            alertBox.className = "alert alert-danger";
            alertBox.classList.remove('d-none');
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i> <span id="btnSubmitText">Se connecter</span>';
        }
    });
</script>

</body>
</html>
