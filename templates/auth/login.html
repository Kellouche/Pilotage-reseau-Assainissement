<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — SWMM Platform SaaS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0a0f1d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
            color: #1e293b;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            width: 100%;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .auth-header {
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            padding: 32px 25px 22px;
            text-align: center;
        }
        .auth-brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #ffffff;
            font-size: 28px;
            margin-bottom: 12px;
            box-shadow: 0 8px 16px rgba(2, 132, 199, 0.35);
        }
        .auth-body {
            padding: 30px;
        }
        .auth-footer {
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            padding: 16px 25px;
            text-align: center;
            font-size: 0.9rem;
        }
        .btn-auth-primary {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            border: none;
            padding: 12px;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 10px;
            transition: all 0.2s ease-in-out;
        }
        .btn-auth-primary:hover {
            background: linear-gradient(135deg, #0369a1, #075985);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.4);
        }
        .activation-box {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 16px;
        }
        .activation-code-input {
            letter-spacing: 8px;
            font-size: 1.4rem;
            font-weight: 700;
            text-align: center;
            background-color: #ffffff;
            border: 2px solid #0284c7;
            box-shadow: 0 2px 8px rgba(2, 132, 199, 0.15);
        }
        .activation-code-input:focus {
            border-color: #0369a1;
            box-shadow: 0 0 0 0.25rem rgba(2, 132, 199, 0.25);
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="auth-header">
        <div class="auth-brand-icon">
            <i class="fas fa-water"></i>
        </div>
        <h3 class="fw-bold mb-1" style="color: #0f172a;">SWMM Platform</h3>
        <p class="text-muted small mb-3">Espace ingénierie d'assainissement et modélisation SWMM 5.2</p>

        <!-- Bascule Navigation Connexion / Inscription -->
        <div class="d-flex p-1 rounded-3 bg-white border shadow-sm text-center">
            <span class="btn btn-sm btn-primary flex-fill fw-bold py-1">
                <i class="fas fa-sign-in-alt me-1"></i> Se connecter
            </span>
            <a href="/register" class="btn btn-sm text-secondary flex-fill fw-semibold py-1 text-decoration-none">
                <i class="fas fa-user-plus me-1"></i> Créer un compte
            </a>
        </div>
    </div>

    <div class="auth-body">
        <div id="alertBox" class="alert alert-danger d-none" role="alert">
            <span id="alertMsg"></span>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label small fw-semibold text-secondary">
                    <i class="fas fa-envelope me-1"></i> Adresse email
                </label>
                <input type="email" class="form-control form-control-lg fs-6" id="email" name="email"
                       placeholder="ingenieur@regie-eaux.dz" required autofocus>
            </div>

            <div class="mb-3" id="passwordGroup">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label for="password" class="form-label small fw-semibold text-secondary mb-0">
                        <i class="fas fa-lock me-1"></i> Mot de passe
                    </label>
                </div>
                <div class="input-group">
                    <input type="password" class="form-control form-control-lg fs-6" id="password" name="password"
                           placeholder="••••••••" required>
                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                        <i class="fas fa-eye text-muted"></i>
                    </button>
                </div>
            </div>

            <!-- Groupe Code d'activation (affiché si le compte n'est pas encore validé) -->
            <div class="mb-3 d-none" id="activationCodeGroup">
                <div class="activation-box mb-2">
                    <div class="d-flex align-items-center justify-content-between mb-2">
                        <label for="activationCode" class="form-label small fw-bold text-primary mb-0">
                            <i class="fas fa-key me-1"></i> Code d'activation à 6 chiffres
                        </label>
                        <span class="badge bg-primary-subtle text-primary border border-primary-subtle" style="font-size: 0.72rem;">
                            <i class="fas fa-clock me-1"></i> Validité 15 min
                        </span>
                    </div>

                    <input type="text" class="form-control form-control-lg activation-code-input mb-1" id="activationCode"
                           maxlength="6" placeholder="••••••" autocomplete="one-time-code">
                    <div class="form-text small text-muted text-center mb-2">
                        Saisissez le code reçu par e-mail pour activer votre compte.
                    </div>

                    <!-- Indicateur pour le développement / aide locale -->
                    <div id="devCodeBox" class="alert alert-info d-none small py-2 px-3 mb-2 text-start" style="border-left: 4px solid #0284c7;">
                        <i class="fas fa-envelope-open-text me-1 text-primary"></i> <strong>E-mail expédié :</strong> Code <strong id="devCodeDisplay" class="fs-6 text-primary font-monospace"></strong> <span class="text-muted small">(copie de secours locale)</span>
                    </div>

                    <!-- Notification de réexpédition réussie -->
                    <div id="resendSuccessBox" class="alert alert-success d-none small py-2 px-3 mb-2 text-start" role="alert">
                        <i class="fas fa-check-circle me-1"></i> <span id="resendSuccessMsg"></span>
                    </div>

                    <!-- Bouton pour demander un nouveau code d'activation -->
                    <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                        <span class="small text-muted">Code expiré ou non reçu ?</span>
                        <button type="button" id="btnResendCode" class="btn btn-sm btn-outline-primary fw-semibold" onclick="handleResendCode()">
                            <i class="fas fa-redo-alt me-1"></i> Renvoyer un code
                        </button>
                    </div>
                </div>
            </div>

            <button type="submit" id="btnSubmit" class="btn btn-primary btn-auth-primary w-100 text-white shadow-sm mt-2 mb-2">
                <i class="fas fa-sign-in-alt me-2"></i> <span id="btnSubmitText">Se connecter</span>
            </button>

            <!-- Action pour basculer / modifier identifiants en mode vérification -->
            <div id="verifyModeActions" class="text-center mt-2 d-none">
                <button type="button" class="btn btn-link btn-sm text-secondary text-decoration-none p-0" onclick="backToLoginMode()">
                    <i class="fas fa-arrow-left me-1"></i> Modifier mes identifiants
                </button>
            </div>
        </form>
    </div>

    <div class="auth-footer text-muted">
        Nouveau sur SWMM Platform ?
        <a href="/register" class="fw-semibold text-primary text-decoration-none">
            Créer un compte
        </a>
    </div>
</div>

<script>
    // Vérifier si l'utilisateur est déjà connecté pour éviter une reconnexion inutile
    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const emailParam = urlParams.get('email');
        if (emailParam) {
            const emailInput = document.getElementById('email');
            if (emailInput) {
                emailInput.value = emailParam;
                document.getElementById('password').focus();
            }
        }

        const existingToken = localStorage.getItem('swmm_access_token');
        if (existingToken) {
            fetch('/api/v1/auth/me', {
                headers: { 'Authorization': `Bearer ${existingToken}` },
                credentials: 'include'
            }).then(r => {
                if (r.ok) {
                    document.cookie = `access_token=${existingToken}; path=/; max-age=604800; SameSite=Lax`;
                    const nextUrl = urlParams.get('next') || '/cockpit';
                    window.location.href = nextUrl;
                }
            }).catch(() => {});
        }
    });

    // Bascule affichage / masquage mot de passe
    const passInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePassword');
    toggleBtn.addEventListener('click', () => {
        const isPass = passInput.type === 'password';
        passInput.type = isPass ? 'text' : 'password';
        toggleBtn.querySelector('i').className = isPass ? 'fas fa-eye-slash text-primary' : 'fas fa-eye text-muted';
    });

    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const alertMsg = document.getElementById('alertMsg');
    const btnSubmit = document.getElementById('btnSubmit');
    const activationGroup = document.getElementById('activationCodeGroup');
    const verifyModeActions = document.getElementById('verifyModeActions');
    const codeInput = document.getElementById('activationCode');
    const devCodeBox = document.getElementById('devCodeBox');
    const devCodeDisplay = document.getElementById('devCodeDisplay');
    const resendSuccessBox = document.getElementById('resendSuccessBox');
    const resendSuccessMsg = document.getElementById('resendSuccessMsg');
    const btnResendCode = document.getElementById('btnResendCode');

    // Mise à jour sécurisée du bouton de validation (sans détruire les références DOM)
    function setSubmitButton(loading, mode = 'login') {
        btnSubmit.disabled = loading;
        if (loading) {
            btnSubmit.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>${mode === 'verify' ? 'Validation du code...' : 'Vérification...'}`;
        } else if (mode === 'verify') {
            btnSubmit.innerHTML = '<i class="fas fa-shield-alt me-2"></i> <span id="btnSubmitText">Valider le code & Se connecter</span>';
        } else {
            btnSubmit.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i> <span id="btnSubmitText">Se connecter</span>';
        }
    }

    // Affichage d'un message d'alerte avec support HTML
    function showAlert(htmlContent, type = 'danger') {
        alertBox.className = `alert alert-${type}`;
        alertMsg.innerHTML = htmlContent;
        alertBox.classList.remove('d-none');
    }

    // Retour au mode identifiants standards
    window.backToLoginMode = function() {
        activationGroup.classList.add('d-none');
        verifyModeActions.classList.add('d-none');
        devCodeBox.classList.add('d-none');
        resendSuccessBox.classList.add('d-none');
        alertBox.classList.add('d-none');
        codeInput.value = '';
        setSubmitButton(false, 'login');
        document.getElementById('password').focus();
    };

    // Gestion du renvoi de code d'activation
    window.handleResendCode = async function() {
        const emailVal = document.getElementById('email').value.trim();
        if (!emailVal) {
            showAlert("Veuillez saisir votre adresse email.", "danger");
            document.getElementById('email').focus();
            return;
        }

        btnResendCode.disabled = true;
        const originalBtnHtml = btnResendCode.innerHTML;
        btnResendCode.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Envoi...';

        try {
            const resp = await fetch('/api/v1/auth/resend-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: emailVal })
            });

            const data = await resp.json();
            if (!resp.ok) {
                throw new Error(data.detail || "Erreur lors du renvoi du code d'activation.");
            }

            if (data.dev_code) {
                devCodeDisplay.textContent = data.dev_code;
                devCodeBox.classList.remove('d-none');
            }

            resendSuccessMsg.innerHTML = "Un nouveau code d'activation a été envoyé par e-mail !<br><small class='text-muted'>Pensez à vérifier votre boîte de réception ainsi que votre dossier Spams / Courrier indésirable.</small>";
            resendSuccessBox.classList.remove('d-none');

            // Réinitialiser le champ du code et donner le focus
            codeInput.value = '';
            codeInput.focus();

            // Masquer l'erreur précédente s'il y en avait une
            alertBox.classList.add('d-none');

            // Compte à rebours anti-spam de 30 secondes
            let seconds = 30;
            btnResendCode.innerHTML = `<i class="fas fa-check text-success me-1"></i> Envoyé (${seconds}s)`;
            const countdown = setInterval(() => {
                seconds -= 1;
                if (seconds <= 0) {
                    clearInterval(countdown);
                    btnResendCode.disabled = false;
                    btnResendCode.innerHTML = '<i class="fas fa-redo-alt me-1"></i> Renvoyer un code';
                } else {
                    btnResendCode.innerHTML = `<i class="fas fa-hourglass-half me-1"></i> Renvoyer (${seconds}s)`;
                }
            }, 1000);

        } catch (err) {
            showAlert(err.message, "danger");
            btnResendCode.disabled = false;
            btnResendCode.innerHTML = originalBtnHtml;
        }
    };

    // Soumission du formulaire (Connexion ou Validation du code)
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.classList.add('d-none');

        const emailVal = document.getElementById('email').value.trim();
        const isVerifying = !activationGroup.classList.contains('d-none');
        const codeVal = codeInput.value.trim();

        if (isVerifying && (!codeVal || codeVal.length < 4)) {
            showAlert("Veuillez saisir le code d'activation à 6 chiffres reçu par e-mail.", "warning");
            codeInput.focus();
            return;
        }

        setSubmitButton(true, isVerifying ? 'verify' : 'login');

        try {
            let data;
            if (isVerifying) {
                // Étape 2 : Vérification du code d'activation
                const resp = await fetch('/api/v1/auth/verify-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: emailVal,
                        code: codeVal
                    })
                });
                data = await resp.json();
                if (!resp.ok) throw new Error(data.detail || "Code d'activation invalide ou expiré.");
            } else {
                // Étape 1 : Connexion standard
                const resp = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: emailVal,
                        password: document.getElementById('password').value
                    })
                });
                data = await resp.json();
                if (!resp.ok) throw new Error(data.detail || 'Identifiants invalides');
            }

            // Si le compte requiert la vérification par code
            if (data.requires_verification) {
                localStorage.removeItem('swmm_access_token');
                document.cookie = "access_token=; path=/; max-age=0";

                activationGroup.classList.remove('d-none');
                verifyModeActions.classList.remove('d-none');

                if (data.dev_code) {
                    devCodeDisplay.textContent = data.dev_code;
                    devCodeBox.classList.remove('d-none');
                } else {
                    devCodeBox.classList.add('d-none');
                }

                showAlert(
                    `<i class="fas fa-envelope me-1"></i> Un code d'activation à 6 chiffres a été envoyé à <strong>${emailVal}</strong> (valable 15 minutes).<br>
                    <small class="text-muted mt-1 d-block"><i class="fas fa-info-circle me-1"></i> Pensez à vérifier votre boîte de réception ainsi que votre dossier <strong>Spams / Courrier indésirable</strong>.</small>`,
                    "warning"
                );

                setSubmitButton(false, 'verify');
                setTimeout(() => codeInput.focus(), 150);
                return;
            }

            // Sauvegarder les jetons d'accès et de rafraîchissement
            if (data.access_token) {
                localStorage.setItem('swmm_access_token', data.access_token);
                document.cookie = `access_token=${data.access_token}; path=/; max-age=604800; SameSite=Lax`;
            }
            if (data.refresh_token) {
                localStorage.setItem('swmm_refresh_token', data.refresh_token);
                document.cookie = `refresh_token=${data.refresh_token}; path=/; max-age=2592000; SameSite=Lax`;
            }

            // Flag pour proposer le choix de projet à la connexion (comme une 1ère fois)
            sessionStorage.setItem('choisir_projet_apres_login', 'true');

            // Redirection vers le cockpit
            const params = new URLSearchParams(window.location.search);
            const nextUrl = params.get('next') || '/cockpit';
            window.location.href = nextUrl;

        } catch (err) {
            const isExpired = err.message && err.message.toLowerCase().includes('expiré');
            if (isExpired) {
                showAlert(
                    `<div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
                        <div><i class="fas fa-hourglass-end text-warning me-1"></i> ${err.message}</div>
                        <button type="button" class="btn btn-sm btn-primary fw-semibold" onclick="handleResendCode()">
                            <i class="fas fa-redo-alt me-1"></i> Demander un nouveau code
                        </button>
                    </div>`,
                    "warning"
                );
            } else if (err.message && (err.message.includes('Identifiants') || err.message.includes('compte'))) {
                showAlert(
                    `<div class="mb-1"><i class="fas fa-exclamation-circle me-1"></i> ${err.message}</div>
                    <div class="mt-2 pt-2 border-top border-danger-subtle small">
                        Pas encore inscrit ?
                        <a href="/register?email=${encodeURIComponent(emailVal)}" class="alert-link fw-bold ms-1 text-decoration-underline">
                            <i class="fas fa-user-plus me-1"></i>Créer un compte
                        </a>
                    </div>`,
                    "danger"
                );
            } else {
                showAlert(err.message, "danger");
            }

            setSubmitButton(false, isVerifying ? 'verify' : 'login');
        }
    });
</script>

</body>
</html>
