<!--
================================================================================
Projet : DrainPilot 5.2 - Plateforme d'Assainissement Urbain & Calcul SWMM
Objet : Modale de revue P1 — file des conduites dont le sens d'écoulement
        supposé est suspect au regard du terrain (SHP.md §8).
        Lecture seule : aucune correction n'est appliquée depuis cette vue.
================================================================================
-->

    <!-- Modal File de revue : suspects de sens d'écoulement -->
    <div id="modal-suspects" onclick="if(event.target === this) fermerModalSuspects();" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(6px); z-index: 3100; align-items: center; justify-content: center;">
        <div style="background: #1e293b; color: #f8fafc; border-radius: 16px; width: 96%; max-width: 980px; max-height: 92vh; display: flex; flex-direction: column; border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6); overflow: hidden;">

            <!-- En-tête -->
            <div style="background: #0f172a; padding: 14px 22px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); display: flex; justify-content: space-between; align-items: center; gap: 12px;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(135deg, #f59e0b, #b45309); display: flex; align-items: center; justify-content: center; font-size: 18px; color: white;">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <div>
                        <h5 style="margin: 0; font-weight: 700; font-size: 1.05rem;">Suspects de sens d'écoulement</h5>
                        <small style="color: #94a3b8;" id="suspects-sous-titre">Analyse terrain IDW — file de revue, aucune correction automatique</small>
                    </div>
                </div>
                <button onclick="fermerModalSuspects()" style="background: transparent; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; line-height: 1;">&times;</button>
            </div>

            <!-- Statistiques -->
            <div id="suspects-stats" style="padding: 10px 22px; display: flex; gap: 18px; flex-wrap: wrap; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 0.78rem;">
                <span style="color:#94a3b8;">Chargement…</span>
            </div>

            <!-- Filtres -->
            <div style="padding: 10px 22px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08);">
                <select id="suspects-filtre-sev" onchange="rendreTableSuspects()"
                        style="font-size: 0.78rem; padding: 6px 8px; background: #0f172a; color: #f8fafc; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;">
                    <option value="">Toutes sévérités</option>
                    <option value="fort">Fort</option>
                    <option value="moyen">Moyen</option>
                    <option value="faible">Faible</option>
                </select>
                <select id="suspects-filtre-conf" onchange="rendreTableSuspects()"
                        style="font-size: 0.78rem; padding: 6px 8px; background: #0f172a; color: #f8fafc; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;">
                    <option value="">Toutes confiances</option>
                    <option value="haute">Confiance haute</option>
                    <option value="moyenne">Confiance moyenne</option>
                    <option value="faible">Confiance faible</option>
                </select>
                <input type="text" id="suspects-filtre-texte" placeholder="Filtrer par code regard…"
                       oninput="rendreTableSuspects()"
                       style="flex:1; min-width:160px; font-size: 0.78rem; padding: 6px 10px; background: #0f172a; color: #f8fafc; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;">
                <button onclick="afficherSuspectsCarte()" id="btn-suspects-carte"
                        style="background: rgba(56,189,248,0.15); border: 1px solid rgba(56,189,248,0.4); color: #7dd3fc; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 0.78rem; font-weight: 600;">
                    <i class="fas fa-map-marker-alt me-1"></i> Voir filtrés sur carte
                </button>
            </div>

            <!-- Tableau -->
            <div id="suspects-corps" style="padding: 12px 22px; overflow-y: auto; flex: 1;">
                <div style="color:#94a3b8; font-size:0.85rem;">Chargement de l'analyse…</div>
            </div>

            <!-- Avertissement -->
            <div style="padding: 10px 22px; border-top: 1px solid rgba(255,255,255,0.08);">
                <div id="suspects-avert" style="font-size: 0.72rem; color: #fbbf24; background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.25); border-radius: 8px; padding: 8px 12px;">
                </div>
            </div>
        </div>
    </div>
