Date de création : 2026-11-16
Objet : Overlay plein écran de verrouillage pendant le chargement du projet
         et la sectorisation des bassins versants (remplace le compteur
         « 77 BV » codé en dur — affichage « -- » tant que non résolu)
================================================================================
-->
    <!-- OVERLAY DE VERROUILLAGE TOTAL PENDANT LE CHARGEMENT DU PROJET -->
    <div id="loading-overlay" style="z-index: 1000000;">
        <style>
            @keyframes loadPulseWave {
                0% { transform: scale(0.8); opacity: 0.9; }
                100% { transform: scale(1.6); opacity: 0; }
            }
            @keyframes loadFloatIcon {
                0% { transform: translateY(-3px); }
                100% { transform: translateY(3px); }
            }
        </style>
        <div style="background: linear-gradient(145deg, rgba(30, 41, 59, 0.98), rgba(15, 23, 42, 0.98)); border: 1.5px solid rgba(56, 189, 248, 0.4); border-radius: 20px; padding: 32px 40px; max-width: 480px; width: 90%; text-align: center; box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 35px rgba(56, 189, 248, 0.25);">

            <!-- Radar / ondes de sectorisation animées -->
            <div style="position: relative; width: 84px; height: 84px; margin: 0 auto 20px;">
                <div style="position: absolute; inset: 0; border-radius: 50%; border: 2px solid #38bdf8; animation: loadPulseWave 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;"></div>
                <div style="position: absolute; inset: 0; border-radius: 50%; border: 2px solid #0284c7; animation: loadPulseWave 2s cubic-bezier(0, 0.2, 0.8, 1) infinite 0.6s;"></div>
                <div style="position: absolute; inset: 8px; border-radius: 50%; background: linear-gradient(135deg, #0284c7, #0369a1); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);">
                    <i class="fas fa-layer-group fa-2x" style="color: #ffffff; animation: loadFloatIcon 1.8s ease-in-out infinite alternate;"></i>
                </div>
            </div>

            <h3 style="font-size: 1.25rem; font-weight: 800; color: #f8fafc; margin-bottom: 6px; letter-spacing: -0.3px;">
                Chargement du projet
            </h3>
            <p style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 18px; line-height: 1.4;">
                Initialisation du réseau &amp; sectorisation des bassins versants
            </p>

            <!-- Message d'étape dynamique -->
            <div style="background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 12px; padding: 14px 20px; margin-bottom: 18px; display: inline-flex; align-items: center; gap: 10px;">
                <i class="fas fa-circle-notch fa-spin" style="color: #38bdf8; font-size: 1.1rem;"></i>
                <span id="loading-overlay-text" style="font-size: 0.85rem; font-weight: 600; color: #cbd5e1;">Initialisation du projet…</span>
            </div>

            <!-- Mention de verrouillage -->
            <div style="font-size: 0.72rem; color: #64748b; display: flex; align-items: center; justify-content: center; gap: 6px;">
                <i class="fas fa-lock" style="color: #f59e0b;"></i>
                <span>Interface verrouillée jusqu'à la fin de la sectorisation</span>
            </div>
        </div>
    </div>
