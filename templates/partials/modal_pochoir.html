<!--
================================================================================
Projet : DrainPilot 5.2 - Plateforme d'Assainissement Urbain & Calcul SWMM
Objet : Modale d'extraction par pochoir — nommage, sources et résultat.
================================================================================
-->

    <!-- Modal Extraction par Pochoir -->
    <div id="modal-pochoir" onclick="if(event.target === this) fermerModalPochoir();" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(6px); z-index: 3100; align-items: center; justify-content: center;">
        <div style="background: #1e293b; color: #f8fafc; border-radius: 16px; width: 94%; max-width: 560px; max-height: 90vh; display: flex; flex-direction: column; border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6); overflow: hidden;">

            <!-- En-tête -->
            <div style="background: #0f172a; padding: 16px 24px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); display: flex; justify-content: space-between; align-items: center; gap: 12px;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(135deg, #8b5cf6, #6d28d9); display: flex; align-items: center; justify-content: center; font-size: 18px; color: white;">
                        <i class="fas fa-vector-square"></i>
                    </div>
                    <div>
                        <h5 style="margin: 0; font-weight: 700; font-size: 1.05rem;">Extraction par pochoir</h5>
                        <small style="color: #94a3b8;" id="pochoir-zone-info">Zone sélectionnée</small>
                    </div>
                </div>
                <button onclick="fermerModalPochoir()" style="background: transparent; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; line-height: 1;">&times;</button>
            </div>

            <!-- Corps -->
            <div style="padding: 20px 24px; overflow-y: auto; flex: 1;">

                <div id="pochoir-statut" style="display:none; margin-bottom: 14px; font-size: 0.82rem; padding: 8px 12px; border-radius: 8px;"></div>

                <!-- Nom de base -->
                <div style="margin-bottom: 14px;">
                    <label style="font-size: 0.78rem; color: #cbd5e1; display: block; margin-bottom: 6px; font-weight: 600;">
                        <i class="fas fa-signature me-1"></i> Nom de base des fichiers
                    </label>
                    <input type="text" id="pochoir-nom" placeholder="ex. Bassin_A4_2026"
                           style="width: 100%; font-size: 0.82rem; padding: 8px; background: #0f172a; color: #f8fafc;
                                  border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;">
                    <div style="font-size: 0.7rem; color: #64748b; margin-top: 4px;">
                        Produit <code>nom_regard.shp</code>, <code>nom_conduite.shp</code>… et <code>nom.gpkg</code>.
                    </div>
                </div>

                <!-- Sources -->
                <div style="margin-bottom: 6px;">
                    <label style="font-size: 0.78rem; color: #cbd5e1; display: block; margin-bottom: 8px; font-weight: 600;">
                        <i class="fas fa-layer-group me-1"></i> Sources à extraire
                    </label>
                    <label style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:#0f172a;border:1px solid rgba(52,211,153,0.3);border-radius:8px;margin-bottom:8px;cursor:pointer;">
                        <input type="checkbox" id="pochoir-reseau" checked style="accent-color:#10b981;width:16px;height:16px;">
                        <span style="font-size:0.84rem;font-weight:600;color:#f1f5f9;">Réseau projet</span>
                        <span style="font-size:0.7rem;color:#64748b;">regards · conduites · rejets · sous-bassins</span>
                    </label>
                    <div id="pochoir-aux-list" style="max-height: 180px; overflow-y: auto; display: grid; gap: 4px;"></div>
                    <div id="pochoir-aux-vide" style="display:none;font-size:0.74rem;color:#64748b;padding:6px 4px;">
                        Aucune couche SIG satellite importée sur ce réseau.
                    </div>
                </div>

            </div>

            <!-- Pied -->
            <div style="padding: 14px 24px; border-top: 1px solid rgba(255,255,255,0.1);
                        display: flex; justify-content: flex-end; gap: 10px; background: #0f172a;">
                <button onclick="fermerModalPochoir()"
                        style="background: transparent; border: 1px solid rgba(255,255,255,0.2);
                               color: #cbd5e1; padding: 8px 18px; border-radius: 8px;
                               cursor: pointer; font-size: 0.82rem;">Annuler</button>
                <button id="btn-pochoir-run" onclick="lancerExtractionPochoir()"
                        style="background: linear-gradient(135deg, #8b5cf6, #6d28d9); border: none;
                               color: white; padding: 8px 22px; border-radius: 8px; cursor: pointer;
                               font-size: 0.82rem; font-weight: 700;">
                    <i class="fas fa-box-open me-1"></i> Extraire et télécharger
                </button>
            </div>

        </div>
    </div>
