    <!-- Modal Profil Utilisateur & Sécurité -->
    <div id="modal-user-profile" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(6px); z-index: 3000; align-items: center; justify-content: center;">
        <div style="background: #1e293b; color: #f8fafc; border-radius: 16px; width: 90%; max-width: 500px; border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6); overflow: hidden;">
            <div style="background: #0f172a; padding: 18px 24px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div style="width: 36px; height: 36px; border-radius: 8px; background: #0284c7; display: flex; align-items: center; justify-content: center; font-size: 16px; color: white;">
                        <i class="fas fa-user-cog"></i>
                    </div>
                    <div>
                        <h5 style="margin: 0; font-weight: 700; font-size: 1.05rem;" id="user-profile-modal-title">Mon Profil &amp; Sécurité</h5>
                        <small style="color: #94a3b8;">Gérer vos informations de compte et de connexion</small>
                    </div>
                </div>
                <button onclick="fermerModalProfil()" style="background: transparent; border: none; color: #94a3b8; font-size: 22px; cursor: pointer; line-height: 1;">&times;</button>
            </div>

            <!-- Onglets Profil -->
            <div style="display: flex; border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.15);">
                <button id="tab-btn-profile-info" onclick="basculerOngletProfil('infos')" style="flex: 1; padding: 12px; background: transparent; border: none; border-bottom: 2px solid #38bdf8; color: #38bdf8; font-weight: 700; font-size: 0.85rem; cursor: pointer;">
                    <i class="fas fa-id-card me-1"></i> Informations
                </button>
                <button id="tab-btn-profile-pass" onclick="basculerOngletProfil('password')" style="flex: 1; padding: 12px; background: transparent; border: none; border-bottom: 2px solid transparent; color: #94a3b8; font-weight: 700; font-size: 0.85rem; cursor: pointer;">
                    <i class="fas fa-key me-1"></i> Mot de passe
                </button>
            </div>

            <div style="padding: 22px 24px;">
                <!-- Onglet 1: Informations -->
                <div id="tab-profile-info">
                    <div style="margin-bottom: 14px;">
                        <label style="display: block; font-size: 0.82rem; color: #94a3b8; margin-bottom: 4px;">Adresse Email :</label>
                        <input type="text" id="profile-edit-email" disabled style="width: 100%; padding: 8px 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: #94a3b8; font-size: 0.85rem;">
                    </div>
                    <div style="margin-bottom: 14px;">
                        <label style="display: block; font-size: 0.82rem; color: #cbd5e1; margin-bottom: 4px;">Nom &amp; Prénom :</label>
                        <input type="text" id="profile-edit-name" style="width: 100%; padding: 8px 12px; background: #0f172a; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; color: #f8fafc; font-size: 0.88rem;">
                    </div>
                    <div id="profile-info-feedback" style="display: none; padding: 8px; border-radius: 6px; font-size: 0.82rem; margin-bottom: 14px;"></div>
                    <button onclick="enregistrerModifProfil()" style="width: 100%; padding: 10px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: 700; font-size: 0.88rem; cursor: pointer;">
                        <i class="fas fa-save me-1"></i> Enregistrer les modifications
                    </button>
                </div>

                <!-- Onglet 2: Mot de passe -->
                <div id="tab-profile-password" style="display: none;">
                    <div style="margin-bottom: 14px;">
                        <label style="display: block; font-size: 0.82rem; color: #cbd5e1; margin-bottom: 4px;">Mot de passe actuel :</label>
                        <input type="password" id="pass-current" placeholder="••••••••" style="width: 100%; padding: 8px 12px; background: #0f172a; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; color: #f8fafc; font-size: 0.88rem;">
                    </div>
                    <div style="margin-bottom: 14px;">
                        <label style="display: block; font-size: 0.82rem; color: #cbd5e1; margin-bottom: 4px;">Nouveau mot de passe (min. 8 car.) :</label>
                        <input type="password" id="pass-new" placeholder="••••••••" style="width: 100%; padding: 8px 12px; background: #0f172a; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; color: #f8fafc; font-size: 0.88rem;">
                    </div>
                    <div style="margin-bottom: 16px;">
                        <label style="display: block; font-size: 0.82rem; color: #cbd5e1; margin-bottom: 4px;">Confirmer le nouveau mot de passe :</label>
                        <input type="password" id="pass-confirm" placeholder="••••••••" style="width: 100%; padding: 8px 12px; background: #0f172a; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; color: #f8fafc; font-size: 0.88rem;">
                    </div>
                    <div id="profile-pass-feedback" style="display: none; padding: 8px; border-radius: 6px; font-size: 0.82rem; margin-bottom: 14px;"></div>
                    <button onclick="enregistrerNouveauMotDePasse()" style="width: 100%; padding: 10px; background: #d97706; color: white; border: none; border-radius: 8px; font-weight: 700; font-size: 0.88rem; cursor: pointer;">
                        <i class="fas fa-lock me-1"></i> Mettre à jour le mot de passe
                    </button>
                </div>
            </div>
        </div>
    </div>
