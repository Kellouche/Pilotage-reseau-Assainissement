    <!-- OVERLAY DE VERROUILLAGE TOTAL PENDANT LA SIMULATION AVEC CHRONOMÈTRE -->
    <div id="sim-blocking-overlay" style="display: none; position: fixed; inset: 0; z-index: 999999; background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); align-items: center; justify-content: center; flex-direction: column; color: #f8fafc; pointer-events: all; user-select: none;">
        <style>
            @keyframes simPulseWave {
                0% { transform: scale(0.8); opacity: 0.9; }
                100% { transform: scale(1.6); opacity: 0; }
            }
            @keyframes simFloatIcon {
                0% { transform: translateY(-3px); }
                100% { transform: translateY(3px); }
            }
        </style>
        <div style="background: linear-gradient(145deg, rgba(30, 41, 59, 0.98), rgba(15, 23, 42, 0.98)); border: 1.5px solid rgba(56, 189, 248, 0.4); border-radius: 20px; padding: 32px 40px; max-width: 480px; width: 90%; text-align: center; box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 35px rgba(56, 189, 248, 0.25);">
            
            <!-- Radar / Ondes hydrauliques animées -->
            <div style="position: relative; width: 84px; height: 84px; margin: 0 auto 20px;">
                <div style="position: absolute; inset: 0; border-radius: 50%; border: 2px solid #38bdf8; animation: simPulseWave 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;"></div>
                <div style="position: absolute; inset: 0; border-radius: 50%; border: 2px solid #0284c7; animation: simPulseWave 2s cubic-bezier(0, 0.2, 0.8, 1) infinite 0.6s;"></div>
                <div style="position: absolute; inset: 8px; border-radius: 50%; background: linear-gradient(135deg, #0284c7, #0369a1); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);">
                    <i class="fas fa-water fa-2x" style="color: #ffffff; animation: simFloatIcon 1.8s ease-in-out infinite alternate;"></i>
                </div>
            </div>

            <h3 id="sim-blocking-title" style="font-size: 1.25rem; font-weight: 800; color: #f8fafc; margin-bottom: 6px; letter-spacing: -0.3px;">
                Simulation hydrodynamique SWMM 5.2
            </h3>
            <p id="sim-blocking-subtitle" style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 18px; line-height: 1.4;">
                Résolution des équations 1D de Saint-Venant &amp; hydrologie Horton
            </p>

            <!-- Chronomètre en temps réel -->
            <div style="background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 12px; padding: 12px 20px; margin-bottom: 18px; display: inline-flex; align-items: center; gap: 10px;">
                <i class="fas fa-stopwatch" style="color: #38bdf8; font-size: 1.3rem;"></i>
                <span style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; color: #64748b; font-weight: 700;">Temps écoulé :</span>
                <span id="sim-chrono-display" style="font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 1.4rem; font-weight: 800; color: #38bdf8; min-width: 90px; text-align: right;">00:00.0</span>
            </div>

            <!-- Message d'étape dynamique -->
            <div id="sim-blocking-phase" style="font-size: 0.82rem; color: #cbd5e1; font-weight: 600; min-height: 22px; display: flex; align-items: center; justify-content: center; gap: 8px;">
                <i class="fas fa-circle-notch fa-spin" style="color: #38bdf8;"></i>
                <span>Génération du modèle .INP &amp; hydrologie Voronoï...</span>
            </div>

            <!-- Message d'avertissement de verrouillage -->
            <div style="margin-top: 20px; padding-top: 14px; border-top: 1px solid rgba(255, 255, 255, 0.08); font-size: 0.72rem; color: #64748b; display: flex; align-items: center; justify-content: center; gap: 6px;">
                <i class="fas fa-lock" style="color: #f59e0b;"></i>
                <span>Interface verrouillée pendant le calcul pour garantir l'intégrité hydraulique</span>
            </div>
        </div>
    </div>
    <!-- Barre de Navigation Supérieure SaaS Moderne & Épurée -->
    <header id="saas-topbar">
