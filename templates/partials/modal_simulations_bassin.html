<!--
================================================================================
Projet : DrainPilot 5.2 - Plateforme d'Assainissement Urbain & Calcul SWMM
Objet : Modale d'historique des simulations d'un bassin versant
       (exécuter / modifier / supprimer)
================================================================================
-->
<div id="modal-simulations-bassin" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.82); backdrop-filter: blur(6px); z-index: 3100; align-items: center; justify-content: center;">
    <div style="background: #1e293b; color: #f8fafc; border-radius: 16px; width: 92%; max-width: 860px; max-height: 86vh; display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 25px 50px rgba(0,0,0,0.6); overflow: hidden;">
        <!-- En-tête -->
        <div style="background: #0f172a; padding: 16px 22px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div style="width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #0284c7, #0369a1); display: flex; align-items: center; justify-content: center; font-size: 16px; color: white;">
                    <i class="fas fa-layer-group"></i>
                </div>
                <div>
                    <h5 style="margin: 0; font-weight: 700; font-size: 1rem;" id="sim-hist-titre">Simulations du bassin</h5>
                    <small style="color: #94a3b8;" id="sim-hist-sous-titre">Historique des calculs SWMM 5.2</small>
                </div>
            </div>
            <button onclick="fermerModalSimulationsBassin()" style="background: transparent; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; line-height: 1;">&times;</button>
        </div>

        <!-- Corps -->
        <div id="sim-hist-corps" style="padding: 18px 22px; overflow-y: auto; flex: 1;">
            <div style="text-align: center; color: #94a3b8; padding: 30px;">
                <i class="fas fa-spinner fa-spin fa-2x mb-3"></i>
                <p>Chargement de l'historique…</p>
            </div>
        </div>

        <!-- Pied de page -->
        <div style="background: #0f172a; padding: 12px 22px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 0.76rem; color: #64748b;" id="sim-hist-pied">Chaque simulation peut être relancée à l'identique, modifiée ou supprimée.</span>
            <button onclick="fermerModalSimulationsBassin()" style="padding: 6px 16px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #e2e8f0; border-radius: 8px; font-size: 0.82rem; font-weight: 600; cursor: pointer;">
                Fermer
            </button>
        </div>
    </div>
</div>
